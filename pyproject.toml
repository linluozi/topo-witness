[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "topo-witness"
version = "0.2.0"
description = "Deterministic topological sort with a chordless, independently verifiable cycle witness"
readme = "README.md"
requires-python = ">=3.9"
license = {text = "MIT"}
authors = [{name = "linluozi"}]
keywords = ["topological-sort", "cycle-detection", "graph", "build-system", "witness"]
classifiers = [
  "Programming Language :: Python :: 3",
  "License :: OSI Approved :: MIT License",
  "Operating System :: OS Independent",
]

[project.urls]
Homepage = "https://github.com/linluozi/topo-witness"

[tool.setuptools]
packages = ["topo_witness"]
